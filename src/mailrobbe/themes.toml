# Research themes: word fields and search templates (D64).
#
# The themes the research concentrates on. Each one becomes a tag and a few saved searches of
# the research file when someone clicks "Themen-Startset anlegen"; the word fields show on the
# Akten screen, every word a search of its own. Nothing is tagged automatically: a search only
# points to mails, people read them and decide. Later milestones (entities, anomalies, topic
# discovery) read the same file. mailrobbe.themes loads and checks it.
#
# Each [[theme]]: key (stable, lowercase), name (the tag's name), color (a TagColor of
# api/schemas.py), description, terms (the word field). Each [[theme.search]]: name and q, the
# text of the search field (search syntax of D20). Words in q are full text with the German
# configuration: inflections match ("Spende" finds "Spenden"), compounds do not, so they are
# listed one by one; "or" joins alternatives; quotes make a phrase. German stop words such as
# "mich", "an", "unter" are dropped, also inside phrases, so phrases need content words; with
# "nicht" dropped, "nicht per Mail" would find every "per Mail", so negations are left out.
# Terms that are numbers ("88") match every such number in the archive and are left out of
# the searches.

[[theme]]
key = "verfassungsfeindlichkeit"
name = "Verfassungsfeindlichkeit"
color = "violet"
description = "Angriffe auf die freiheitliche demokratische Grundordnung: Umsturzpläne, Verächtlichmachung von Parlament, Justiz und Presse, Reichsbürger-Erzählungen, Umgang mit dem Verfassungsschutz."
terms = [
    "Umsturz", "Systemwechsel", "Machtergreifung", "Machtübernahme", "Tag X", "Bürgerkrieg",
    "Säuberung", "Widerstandsrecht", "Volksverräter", "Systemparteien", "Altparteien",
    "Systempresse", "Lügenpresse", "Meinungsdiktatur", "Gesinnungsdiktatur", "Gleichschaltung",
    "Volksgemeinschaft", "Ermächtigungsgesetz", "Ausnahmezustand", "Reichsbürger",
    "Selbstverwalter", "BRD GmbH", "Reichsverfassung", "Staatsangehörigkeitsausweis",
    "Deutsches Reich", "Verfassungsschutz", "Beobachtungsfall", "Verdachtsfall",
    "Unvereinbarkeitsliste",
]

[[theme.search]]
name = "Verfassungsfeindlichkeit: Umsturz und Tag X"
q = 'Umsturz or Systemwechsel or Machtergreifung or Machtübernahme or "Tag X" or Bürgerkrieg or Säuberung'

[[theme.search]]
name = "Verfassungsfeindlichkeit: Verächtlichmachung des Staates"
q = 'Volksverräter or Systemparteien or Altparteien or Systempresse or Lügenpresse or Meinungsdiktatur or Gesinnungsdiktatur or Gleichschaltung'

[[theme.search]]
name = "Verfassungsfeindlichkeit: Reichsbürger"
q = 'Reichsbürger or Selbstverwalter or "BRD GmbH" or Reichsverfassung or Staatsangehörigkeitsausweis or "Deutsches Reich"'

[[theme.search]]
name = "Verfassungsfeindlichkeit: Verfassungsschutz"
q = 'Verfassungsschutz or Beobachtungsfall or Verdachtsfall or Unvereinbarkeitsliste'

