[project]
name = "mailrobbe"
version = "0.1.0"
description = "Import, verify and explore large MBOX archives"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "av>=19.0",  # decodes recordings for the transcription (D292), FFmpeg's libraries as wheels
    "cryptography>=50.0.2",
    "dkimpy>=1.1.8",
    "dnspython>=2.9.0",
    "fastapi>=0.156.1",
    "fpdf2>=2.8.9",
    "gmpy2>=2.2",
    "mammoth>=1.13.0",
    "pillow>=11.0",  # the social media image (D214); fpdf2 brings it anyway
    "msoffcrypto-tool>=5.4",
    "numpy>=2.3",  # samples of the transcription
    "onnx-asr>=0.12.0",  # Parakeet and Silero VAD on ONNX Runtime (D290)
    "onnxruntime>=1.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.19.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mailrobbe = "mailrobbe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# tests/dkim would otherwise make ruff treat dkimpy as a first-party module.
known-third-party = ["dkim"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^\\.claude/"]

[[tool.mypy.overrides]]
module = ["dkim", "dkim.*", "gmpy2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mammoth", "mammoth.*", "msoffcrypto", "msoffcrypto.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "db: needs PostgreSQL (MAILROBBE_TEST_DATABASE_URL)",
    "slow: takes more than a few seconds",
]
