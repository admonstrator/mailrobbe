[project]
name = "mailspider"
version = "0.1.0"
description = "Import, verify and explore large MBOX archives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "dkimpy>=1.1.8",
    "dnspython>=2.9.0",
    "fastapi>=0.156.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mailspider = "mailspider.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^\\.claude/"]

[[tool.mypy.overrides]]
module = ["dkim", "dkim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "db: needs PostgreSQL (MAILSPIDER_TEST_DATABASE_URL)",
    "slow: takes more than a few seconds",
]
