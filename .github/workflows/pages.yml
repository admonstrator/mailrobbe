name: Pages

# The project page at https://mailrobbe.admon.me: site/ plus the logo files, deployed whenever
# one of them changes on main. Settings → Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - site/**
      - frontend/public/logo.svg
      - frontend/public/favicon.svg
      - frontend/public/logo-wordmark.svg
      - docs/logo/logo-wordmark-dark.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the page
        run: |
          mkdir _site
          cp -r site/. _site/
          cp frontend/public/logo.svg frontend/public/favicon.svg frontend/public/logo-wordmark.svg _site/
          cp docs/logo/logo-wordmark-dark.svg _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
