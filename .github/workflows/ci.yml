name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mailrobbe
          POSTGRES_PASSWORD: mailrobbe
          POSTGRES_DB: mailrobbe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailrobbe -d mailrobbe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags after v7, so this pins the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          MAILROBBE_TEST_DATABASE_URL: postgresql+asyncpg://mailrobbe:mailrobbe@127.0.0.1:5432/mailrobbe
          MAILROBBE_REQUIRE_DB: "1"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres and backend
        run: docker compose up -d --build --wait
      - name: Health endpoint reports the migrated schema
        run: |
          health=$(curl --fail --silent --show-error http://127.0.0.1:8000/api/health)
          echo "$health"
          test "$(echo "$health" | jq -r .schema_revision)" = 0011
      - name: MBOX mount is read-only
        run: |
          if output=$(docker compose exec -T backend sh -c 'touch /data/mbox/x' 2>&1); then
            echo "/data/mbox is writable" >&2
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'Read-only file system'
      - name: Generate test data
        run: docker compose run --rm generator --mails 1000
      - name: Import over the read-only mount stores every generated mail
        run: |
          docker compose run --rm backend mailrobbe import
          sql() { docker compose exec -T db psql -U mailrobbe -d mailrobbe -tAc "$1"; }
          test "$(sql 'SELECT count(*) FROM mail')" = "$(wc -l < data/mbox/_generator/manifest.jsonl)"
          test "$(sql "SELECT count(*) FROM mail WHERE dkim_status = 'pass'")" -gt 0
      - name: Import dashboard shows the finished command line import
        run: |
          get() { curl --fail --silent --show-error "http://127.0.0.1:8000$1"; }
          status=$(get /api/import/status)
          echo "$status" | jq '{totals, import_job}'
          echo "$status" | jq -e '.totals.files > 0 and .totals.done == .totals.files'
          echo "$status" | jq -e '.import_job.status == "done" and .import_job.origin == "cli"'
          get /api/import/summary | jq -e '.db_size_bytes > 0 and .fulltext_index_bytes > 0'
      - name: Import started from the dashboard finds nothing new and ends
        run: |
          get() { curl --fail --silent --show-error "http://127.0.0.1:8000$1"; }
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:8000/api/import/start | jq -e '.origin == "ui"'
          for _ in $(seq 60); do
            job=$(get /api/import/status | jq .import_job)
            test "$(echo "$job" | jq -r .status)" = running || break
            sleep 1
          done
          echo "$job"
          echo "$job" | jq -e '.status == "done" and .origin == "ui"'
      - name: Web UI and mail API serve the imported mails
        run: |
          get() { curl --fail --silent --show-error "http://127.0.0.1:8000$1"; }
          get / | grep -q '<div id="root">'
          get '/mails/1?q=x' | grep -q '<div id="root">'
          page=$(get '/api/mails?limit=5')
          test "$(echo "$page" | jq '.items | length')" = 5
          id=$(echo "$page" | jq '.items[0].id')
          get "/api/mails/$id" | jq -e '.source.path'
          get "/api/mails/$id/body?format=raw" | jq -e '.size > 0'
          get "/api/mails/summary?dkim=pass" | jq -e '.total > 0'
          get /api/stats | jq -e ".mails == $(wc -l < data/mbox/_generator/manifest.jsonl)"
      - name: Relationship map and GraphML export serve the imported edges
        run: |
          get() { curl --fail --silent --show-error "http://127.0.0.1:8000$1"; }
          sql() { docker compose exec -T db psql -U mailrobbe -d mailrobbe -tAc "$1"; }
          get /karte | grep -q '<div id="root">'
          get '/api/graph?mode=top&limit=20' | jq -e '(.nodes | length) > 0 and (.edges | length) > 0'
          get '/api/graph/export.graphml?mode=top&limit=20' | grep -q '<graphml'
          edges=$(docker compose run --rm -T backend mailrobbe graph export - | grep -c '<edge ')
          test "$edges" = "$(sql 'SELECT count(*) FROM edge')"
          test "$edges" -gt 0
      - name: Load test command measures every view
        run: docker compose exec -T backend mailrobbe bench --rounds 1
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
