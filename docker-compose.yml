# Works on Docker Desktop (macOS) and Linux. Sized for a machine with about 10 GB RAM shared by
# Postgres and the importer; every value below can be overridden in a .env file next to this one.
name: mailrobbe

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mailrobbe
      POSTGRES_PASSWORD: ${MAILROBBE_DB_PASSWORD:-mailrobbe}
      POSTGRES_DB: mailrobbe
    command:
      - postgres
      - -c
      - shared_buffers=${MAILROBBE_PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${MAILROBBE_PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${MAILROBBE_PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${MAILROBBE_PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - max_wal_size=4GB
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${MAILROBBE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailrobbe -d mailrobbe"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Serves the API and the web UI. The import dashboard starts `mailrobbe import` and
  # `mailrobbe dkim` as child processes of the server, in this container with the same settings
  # and MBOX mount (D46); their output shows in `docker compose logs backend`. A run on the
  # command line, docker compose run --rm backend mailrobbe import, gets a container of its own
  # with the same mount, and the dashboard shows and pauses it as well.
  backend:
    build: .
    # On `docker compose stop` or a rebuild the server sends its runs SIGTERM and waits up to
    # 50 s for them to commit and pause (D15); the grace period covers that. The init process
    # as PID 1 forwards the signal to the server and reaps the processes of ended runs.
    init: true
    stop_grace_period: 60s
    environment:
      MAILROBBE_DATABASE_URL: postgresql+asyncpg://mailrobbe:${MAILROBBE_DB_PASSWORD:-mailrobbe}@db:5432/mailrobbe
      MAILROBBE_MBOX_DIR: /data/mbox
      # Empty means the default, min(8, CPU count).
      MAILROBBE_IMPORT_WORKERS: ${MAILROBBE_IMPORT_WORKERS:-}
      # Empty means the defaults, 50MiB (no hash above) and 128MiB (headers only above).
      MAILROBBE_IMPORT_ATTACHMENT_HASH_LIMIT: ${MAILROBBE_IMPORT_ATTACHMENT_HASH_LIMIT:-}
      MAILROBBE_IMPORT_MAX_MAIL_SIZE: ${MAILROBBE_IMPORT_MAX_MAIL_SIZE:-}
      # DKIM key lookups: comma-separated IP addresses; empty means the system resolver.
      # Workers, attachment limit and resolvers are the defaults: the dashboard's settings
      # override them for the imports it starts (D49).
      MAILROBBE_DKIM_NAMESERVERS: ${MAILROBBE_DKIM_NAMESERVERS:-}
      # Web UI: Basic Auth when both are set (D4); the owner's domains for "Nur extern <-> intern".
      MAILROBBE_BASIC_AUTH_USER: ${MAILROBBE_BASIC_AUTH_USER:-}
      MAILROBBE_BASIC_AUTH_PASSWORD: ${MAILROBBE_BASIC_AUTH_PASSWORD:-}
      MAILROBBE_INTERNAL_DOMAINS: ${MAILROBBE_INTERNAL_DOMAINS:-}
      # Signals (D131, D133): the time zone of night hours and weekends, and domains of private
      # mail providers beside the list in themes.toml.
      MAILROBBE_TIMEZONE: ${MAILROBBE_TIMEZONE:-Europe/Berlin}
      MAILROBBE_PRIVATE_DOMAINS: ${MAILROBBE_PRIVATE_DOMAINS:-}
      # Converted documents and decoded audio and video for the previews (D124); safe to delete.
      MAILROBBE_PREVIEW_DIR: /data/previews
    volumes:
      - ${MAILROBBE_MBOX_HOST_DIR:-./data/mbox}:/data/mbox:ro
      - previews:/data/previews
    ports:
      - "127.0.0.1:${MAILROBBE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Test data without a local Python setup: docker compose run --rm generator --mails 10000
  generator:
    build: .
    profiles: ["tools"]
    entrypoint: ["mailrobbe", "generate", "--out", "/data/mbox"]
    volumes:
      - ${MAILROBBE_MBOX_HOST_DIR:-./data/mbox}:/data/mbox

volumes:
  pgdata:
  previews:
