<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Mailrobbe</title>
  <defs>
    <clipPath id="mailrobbe-frame"><rect width="64" height="64"/></clipPath>
    <clipPath id="mailrobbe-lens"><circle cx="51.5" cy="32" r="4.5"/></clipPath>
  </defs>
  <!-- the board -->
  <rect x="3.5" y="3.5" width="57" height="42" rx="3" fill="#E2BE8C" stroke="#8B5E34" stroke-width="3"/>
  <g stroke="#16181D" stroke-width="1.3" stroke-linejoin="round" fill="#FFFFFF">
    <g transform="rotate(-6 16 14)">
      <rect x="8" y="8.5" width="16" height="11" rx="1"/>
      <path d="M8.6 9.3 L16 14.5 L23.4 9.3" fill="none"/>
    </g>
    <g transform="rotate(5 48 13)">
      <rect x="40" y="7.5" width="16" height="11" rx="1"/>
      <path d="M40.6 8.3 L48 13.5 L55.4 8.3" fill="none"/>
    </g>
    <g transform="rotate(-5 11.5 31)">
      <rect x="7" y="26" width="9" height="10" rx="0.5"/>
      <path d="M9 29.5 H14 M9 32 H14" fill="none" stroke-width="1"/>
    </g>
  </g>
  <!-- the red threads -->
  <path d="M16 10 Q32 17 48 9.5 L52 27 M16 10 L11.5 27 M48 9.5 L11.5 27" stroke="#DC2626" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
  <g fill="#DC2626">
    <circle cx="16" cy="10" r="1.8"/><circle cx="48" cy="9.5" r="1.8"/>
    <circle cx="11.5" cy="27" r="1.6"/>
  </g>
  <!-- the seal -->
  <g clip-path="url(#mailrobbe-frame)">
    <g transform="translate(7 14) scale(0.78)">
      <path fill="#7B8597" d="M32 22 C45 22 52 31 52 41 C52 47 54 56 60 68 L4 68 C10 56 12 47 12 41 C12 31 19 22 32 22 Z"/>
      <circle cx="27.5" cy="45" r="5.5" fill="#DDE2E8"/>
      <circle cx="36.5" cy="45" r="5.5" fill="#DDE2E8"/>
      <path fill="#16181D" d="M29.2 40.3 Q32 39.3 34.8 40.3 Q34.6 43 32 44.2 Q29.4 43 29.2 40.3 Z"/>
      <g fill="#5B6270">
        <circle cx="25.5" cy="45" r="0.8"/><circle cx="27.5" cy="47.3" r="0.8"/>
        <circle cx="38.5" cy="45" r="0.8"/><circle cx="36.5" cy="47.3" r="0.8"/>
      </g>
      <circle cx="24" cy="34" r="3.2" fill="#16181D"/><circle cx="25" cy="33" r="1" fill="#FFFFFF"/>
      <circle cx="40" cy="34" r="3.2" fill="#16181D"/><circle cx="41" cy="33" r="1" fill="#FFFFFF"/>
    </g>
  </g>
  <!-- the magnifier on the yellow note -->
  <path d="M48.6 36.6 L46.6 47.5" stroke="#1D5BD6" stroke-width="2.6" stroke-linecap="round"/>
  <g clip-path="url(#mailrobbe-lens)">
    <rect x="46" y="26" width="11" height="12" fill="#F7DC6F"/>
    <path d="M48 29.8 H55 M48 32.3 H55 M48 34.8 H53" stroke="#16181D" stroke-width="1.1"/>
  </g>
  <circle cx="51.5" cy="32" r="5.5" fill="#FFFFFF" fill-opacity="0.25" stroke="#1D5BD6" stroke-width="2.2"/>
  <path fill="#6A7385" d="M40.5 59 C41.5 54 44 50 47 49.4 C49 49.2 49.6 51.2 48.4 52.8 C46.6 55 44 57.2 40.5 59 Z"/>
</svg>
